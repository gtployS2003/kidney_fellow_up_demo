<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ผลตรวจ Lab | Kidney Transplant Follow-up System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body class="font-sans bg-bgapp text-slate-800">

<div class="flex min-h-screen">
  <div id="app-sidebar"></div>

  <div class="flex-1 min-w-0 flex flex-col">
    <div id="app-topbar"></div>

    <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
        <div>
          <h2 class="text-xl font-bold text-slate-800">ผลตรวจ Lab</h2>
          <p class="text-sm text-slate-500 mt-0.5">นายสมชาย ใจดี · HN-102345 · ผลตรวจล่าสุดวันที่ 02 ก.ย. 2569</p>
        </div>
        <div class="flex gap-2">
          <button class="flex items-center gap-2 px-3.5 py-2 rounded-lg border border-slate-200 bg-white text-sm font-medium text-slate-600 hover:bg-slate-50 transition"><i data-lucide="download" class="w-4 h-4"></i> ส่งออกผล PDF</button>
          <button class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-medium transition"><i data-lucide="plus" class="w-4 h-4"></i> บันทึกผลใหม่</button>
        </div>
      </div>

      <!-- Range chips -->
      <div class="flex items-center gap-2 fade-in">
        <span class="text-xs font-medium text-slate-500 mr-1">ช่วงเวลา:</span>
        <button class="chip-btn px-3.5 py-1.5 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">7 วัน</button>
        <button class="chip-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold border border-primary">1 เดือน</button>
        <button class="chip-btn px-3.5 py-1.5 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">3 เดือน</button>
        <button class="chip-btn px-3.5 py-1.5 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">6 เดือน</button>
      </div>

      <!-- Lab param cards grid -->
      <div id="lab-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <!-- Trend chart -->
      <div class="card p-5 fade-in">
        <div class="flex items-center justify-between mb-1">
          <div>
            <h3 class="font-semibold text-slate-800 text-sm">แนวโน้ม Creatinine &amp; eGFR</h3>
            <p class="text-xs text-slate-400">ย้อนหลัง 7 เดือน</p>
          </div>
          <span class="badge badge-green"><i data-lucide="trending-up" class="w-3 h-3"></i> การทำงานของไตดีขึ้น</span>
        </div>
        <div class="h-80 mt-3"><canvas id="chart-lab-trend"></canvas></div>
      </div>

      <!-- Lab history table -->
      <div class="card p-5 fade-in">
        <h3 class="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-primary"></i> ประวัติผลตรวจ Lab (Lab History)</h3>
        <div class="overflow-x-auto">
          <table class="table-modern">
            <thead>
              <tr><th>Date</th><th>Test</th><th>Result</th><th>Reference</th><th>Status</th></tr>
            </thead>
            <tbody id="lab-history-tbody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
  StaffLayout.init({ role: "doctor", active: "lab", title: "ผลตรวจ Lab" });

  const D = window.MOCK_DATA;

  const statusMeta = {
    normal: { badge: "badge-green", label: "ปกติ", ring: "" },
    high: { badge: "badge-red", label: "สูง", ring: "ring-2 ring-red-100 border-red-200" },
    low: { badge: "badge-amber", label: "ต่ำ", ring: "ring-2 ring-amber-100 border-amber-200" },
    na: { badge: "badge-slate", label: "ไม่มีข้อมูล", ring: "" },
  };

  document.getElementById("lab-cards").innerHTML = D.labParams
    .map((p) => {
      const meta = statusMeta[p.status] || statusMeta.normal;
      const isNa = p.status === "na";
      const diff = isNa ? 0 : +(p.current - p.previous).toFixed(2);
      const arrowIcon = diff > 0 ? "arrow-up-right" : diff < 0 ? "arrow-down-right" : "minus";
      const arrowColor = diff > 0 ? "text-red-500" : diff < 0 ? "text-teal" : "text-slate-400";
      return `
      <div class="card card-hover p-5 fade-in border ${meta.ring || "border-slate-200"}">
        <div class="flex items-center justify-between mb-3">
          <div>
            <p class="text-sm font-semibold text-slate-800">${p.name}</p>
            <p class="text-[11px] text-slate-400">${p.unit}</p>
          </div>
          <span class="badge ${meta.badge}">${meta.label}</span>
        </div>
        <div class="flex items-end gap-2">
          <p class="text-3xl font-bold text-slate-800">${isNa ? "-" : p.current}</p>
          ${!isNa ? `<span class="flex items-center gap-0.5 text-xs font-semibold ${arrowColor} mb-1"><i data-lucide="${arrowIcon}" class="w-3.5 h-3.5"></i>${Math.abs(diff)}</span>` : ""}
        </div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 text-xs">
          <span class="text-slate-400">ครั้งก่อน: <span class="text-slate-600 font-medium">${isNa ? "-" : p.previous}</span></span>
          <span class="text-slate-400">ช่วงปกติ: <span class="text-slate-600 font-medium">${p.range}</span></span>
        </div>
      </div>`;
    })
    .join("");

  // Lab history table — แปลงข้อมูล labTrend (7 เดือนล่าสุด) เป็นประวัติผลตรวจรายการ
  const historyTests = [
    { key: "creatinine", name: "Creatinine", unit: "mg/dL", ref: "0.6 - 1.3", inRange: (v) => v >= 0.6 && v <= 1.3 },
    { key: "egfr", name: "eGFR", unit: "mL/min/1.73m²", ref: "> 60", inRange: (v) => v > 60 },
    { key: "tac", name: "Tacrolimus Level", unit: "ng/mL", ref: "5 - 10", inRange: (v) => v >= 5 && v <= 10 },
  ];
  const historyRows = [];
  D.labTrend.labels.forEach((date, i) => {
    historyTests.forEach((t) => {
      const value = D.labTrend[t.key][i];
      historyRows.push({ date, test: t.name, result: `${value} ${t.unit}`, ref: t.ref, normal: t.inRange(value) });
    });
  });
  document.getElementById("lab-history-tbody").innerHTML = historyRows
    .slice()
    .reverse()
    .map(
      (r) => `
    <tr>
      <td class="text-slate-500">${r.date}</td>
      <td class="font-medium text-slate-700">${r.test}</td>
      <td>${r.result}</td>
      <td class="text-slate-400">${r.ref}</td>
      <td>${r.normal ? '<span class="badge badge-green">ปกติ</span>' : '<span class="badge badge-red">ผิดปกติ</span>'}</td>
    </tr>`
    )
    .join("");

  Charts.lineChart(document.getElementById("chart-lab-trend"), {
    labels: D.labTrend.labels,
    datasets: [
      { label: "Creatinine (mg/dL)", data: D.labTrend.creatinine, color: Charts.COLORS.red },
      { label: "eGFR (mL/min/1.73m²)", data: D.labTrend.egfr, color: Charts.COLORS.primary, fill: true, fillColor: Charts.COLORS.primarySoft },
    ],
  });

  lucide.createIcons();
</script>
</body>
</html>
