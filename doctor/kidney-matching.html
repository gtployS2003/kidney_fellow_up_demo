<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>จับคู่ผู้บริจาคไต | Kidney Transplant Follow-up System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="font-sans bg-bgapp text-slate-800">

<div class="flex min-h-screen">
  <div id="app-sidebar"></div>

  <div class="flex-1 min-w-0 flex flex-col">
    <div id="app-topbar"></div>

    <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Kidney Matching System</h2>
          <p class="text-sm text-slate-500 mt-0.5">เปรียบเทียบความเข้ากันได้ระหว่างผู้บริจาคและผู้ป่วยในบัญชีรอคิว</p>
        </div>
        <a href="donor-registration.html" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-medium transition"><i data-lucide="plus" class="w-4 h-4"></i> เพิ่มผู้บริจาคใหม่</a>
      </div>

      <!-- Selectors -->
      <div class="card p-4 fade-in grid sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">เลือกผู้บริจาค (Donor)</label>
          <select id="select-donor" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">เลือกผู้ป่วยที่ต้องการเปรียบเทียบ (Recipient)</label>
          <select id="select-patient" class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white"></select>
        </div>
      </div>

      <!-- 3-column matching layout -->
      <div class="grid lg:grid-cols-[1fr_1.1fr_1fr] gap-4 fade-in">
        <!-- LEFT: Recipient -->
        <div class="card p-5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3 flex items-center gap-1.5"><i data-lucide="user-round" class="w-3.5 h-3.5"></i> Recipient</p>
          <div id="recipient-card"></div>
        </div>

        <!-- CENTER: Matching score -->
        <div class="card p-5 flex flex-col items-center justify-center text-center gradient-mesh" style="background: linear-gradient(180deg,#f8fafc,#ffffff);">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3">Matching Score</p>
          <div id="score-ring-mount"></div>
          <div id="match-status-badge" class="mt-3"></div>
          <div id="score-breakdown" class="grid grid-cols-2 gap-2.5 mt-5 w-full text-left"></div>
        </div>

        <!-- RIGHT: Donor -->
        <div class="card p-5">
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3 flex items-center gap-1.5"><i data-lucide="heart-handshake" class="w-3.5 h-3.5"></i> Donor</p>
          <div id="donor-card"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-wrap justify-end gap-2 fade-in">
        <button id="btn-reject-match" class="flex items-center gap-1.5 px-4 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 text-sm font-semibold transition"><i data-lucide="x-circle" class="w-4 h-4"></i> Reject</button>
        <a href="kidney-suitability.html" class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-semibold transition"><i data-lucide="clipboard-check" class="w-4 h-4"></i> ประเมินความเหมาะสม (Suitability Assessment)</a>
      </div>

      <!-- Matching history -->
      <div class="card p-5 fade-in">
        <h3 class="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-primary"></i> Matching History</h3>
        <div id="matching-history" class="timeline-line space-y-6"></div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  StaffLayout.init({ role: "doctor", active: "matching", title: "จับคู่ผู้บริจาคไต" });

  const D = window.MOCK_DATA;

  // Selectors
  document.getElementById("select-donor").innerHTML = D.donors
    .map((d) => `<option value="${d.id}">${d.id} · ${d.name} · ${d.type} · ${d.blood}</option>`)
    .join("");
  document.getElementById("select-patient").innerHTML = D.waitingList
    .map((p) => `<option value="${p.hn}">${p.name} · ${p.hn} · ${p.blood}</option>`)
    .join("");

  const BLOOD_COMPAT = {
    "O+": ["O+", "A+", "B+", "AB+"], "O-": ["O+", "O-", "A+", "A-", "B+", "B-", "AB+", "AB-"],
    "A+": ["A+", "AB+"], "A-": ["A+", "A-", "AB+", "AB-"],
    "B+": ["B+", "AB+"], "B-": ["B+", "B-", "AB+", "AB-"],
    "AB+": ["AB+"], "AB-": ["AB+", "AB-"],
  };

  function hlaMatchCount(a, b) {
    const setA = new Set(a.split(",").map((s) => s.trim()));
    const setB = new Set(b.split(",").map((s) => s.trim()));
    let n = 0;
    setA.forEach((x) => { if (setB.has(x)) n++; });
    return Math.min(n, 6);
  }

  const STATUS_META = {
    "no-match": { label: "No Match", cls: "badge-red", icon: "x-circle" },
    possible: { label: "Possible Match", cls: "badge-amber", icon: "help-circle" },
    evaluating: { label: "Under Evaluation", cls: "badge-blue", icon: "hourglass" },
    passed: { label: "Match Passed", cls: "badge-green", icon: "check-circle-2" },
    rejected: { label: "Rejected", cls: "badge-red", icon: "x-circle" },
    accepted: { label: "Accepted", cls: "badge-blue", icon: "badge-check" },
    transplanted: { label: "Transplanted", cls: "badge-teal", icon: "syringe" },
  };

  function computeMatch(donor, patient) {
    const preset = D.matchingResults.find((m) => m.donorId === donor.id && m.patientHn === patient.hn);
    const bloodOk = (BLOOD_COMPAT[donor.blood] || []).includes(patient.blood);
    if (preset) {
      const hlaN = parseInt(preset.hla, 10);
      return { bloodOk: preset.bloodCompat, hlaN, hlaLabel: preset.hla, crossmatch: preset.crossmatch, pra: preset.pra, coldIschemic: preset.coldIschemic, score: preset.score, statusKey: preset.status };
    }
    const hlaN = hlaMatchCount(donor.hla, patient.hla);
    const crossmatch = donor.crossmatch;
    const pra = patient.pra;
    const score = Math.round(
      (bloodOk ? 30 : 0) + (hlaN / 6) * 40 + (crossmatch === "Negative" ? 20 : 0) + (parseInt(pra, 10) < 10 ? 10 : parseInt(pra, 10) < 25 ? 5 : 0)
    );
    let statusKey = "no-match";
    if (bloodOk) statusKey = score >= 85 ? "passed" : score >= 60 ? "evaluating" : "possible";
    return { bloodOk, hlaN, hlaLabel: `${hlaN}/6 Match`, crossmatch, pra, coldIschemic: donor.coldIschemic, score: Math.max(0, Math.min(100, score)), statusKey };
  }

  function renderRecipient(p) {
    document.getElementById("recipient-card").innerHTML = `
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold text-slate-500 shrink-0">${p.name.slice(0, 2)}</div>
        <div class="min-w-0">
          <p class="font-bold text-slate-800 truncate">${p.name}</p>
          <p class="text-xs text-slate-500">${p.hn}</p>
        </div>
      </div>
      <div class="space-y-2.5 text-sm">
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Age</span><span class="font-semibold text-slate-700">${p.age} ปี</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Blood Group</span><span class="badge badge-slate">${p.blood}</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">HLA</span><span class="font-semibold text-slate-700 text-right">${p.hla}</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">PRA</span><span class="font-semibold text-slate-700">${p.pra}</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Waiting</span><span class="font-semibold text-slate-700">${p.duration}</span></div>
      </div>`;
  }

  function renderDonor(d) {
    document.getElementById("donor-card").innerHTML = `
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:#f0fdfa;color:#0f766e"><i data-lucide="heart-handshake" class="w-6 h-6"></i></div>
        <div class="min-w-0">
          <p class="font-bold text-slate-800 truncate">${d.name}</p>
          <p class="text-xs text-slate-500">${d.id} · ${d.type}</p>
        </div>
      </div>
      <div class="space-y-2.5 text-sm">
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Age</span><span class="font-semibold text-slate-700">${d.age} ปี</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Blood Group</span><span class="badge badge-slate">${d.blood}</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">HLA</span><span class="font-semibold text-slate-700 text-right">${d.hla}</span></div>
        <div class="flex items-center justify-between"><span class="text-slate-400 text-xs">Organ</span><span class="font-semibold text-slate-700">${d.organ}</span></div>
      </div>
      <a href="donor-profile.html?id=${d.id}" class="mt-4 flex items-center justify-center gap-1.5 text-xs font-semibold text-primary hover:underline">ดูโปรไฟล์ผู้บริจาค <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>`;
    lucide.createIcons();
  }

  function renderScore(m) {
    document.getElementById("score-ring-mount").innerHTML = Components.matchingScore({ score: m.score, size: 128, stroke: 10 });
    const s = STATUS_META[m.statusKey] || STATUS_META["no-match"];
    document.getElementById("match-status-badge").innerHTML = `<span class="badge ${s.cls}"><i data-lucide="${s.icon}" class="w-3 h-3"></i> ${s.label}</span>`;
    document.getElementById("score-breakdown").innerHTML = [
      { label: "Blood Compatibility", value: m.bloodOk ? "Compatible" : "Incompatible", ok: m.bloodOk },
      { label: "HLA Matching", value: m.hlaLabel, ok: m.hlaN >= 4 },
      { label: "Crossmatch", value: m.crossmatch, ok: m.crossmatch === "Negative" },
      { label: "PRA", value: m.pra, ok: parseInt(m.pra, 10) < 20 },
      { label: "Cold Ischemic Time", value: m.coldIschemic, ok: true },
    ]
      .map(
        (f) => `
      <div class="rounded-lg bg-slate-50 p-2.5">
        <p class="text-[10px] text-slate-400 mb-0.5">${f.label}</p>
        <p class="text-xs font-semibold ${f.ok ? "text-green-600" : "text-red-600"}">${f.value}</p>
      </div>`
      )
      .join("");
    lucide.createIcons();
  }

  function renderHistory(donorId) {
    const history = D.matchingResults.filter((m) => m.donorId === donorId).sort((a, b) => (a.date < b.date ? 1 : -1));
    document.getElementById("matching-history").innerHTML =
      history
        .map((h) => {
          const p = D.waitingList.find((w) => w.hn === h.patientHn);
          const s = STATUS_META[h.status] || STATUS_META["no-match"];
          return `
        <div class="relative">
          <div class="timeline-node" style="background:${s.cls === "badge-green" ? "#16a34a" : s.cls === "badge-red" ? "#dc2626" : "#2563eb"}"><i data-lucide="${s.icon}" class="w-4 h-4"></i></div>
          <div class="flex flex-wrap items-center gap-2">
            <p class="text-sm font-semibold text-slate-800">${h.date}</p>
            <span class="badge ${s.cls}">${s.label}</span>
          </div>
          <p class="text-xs text-slate-600 mt-0.5">Donor ${h.donorId} × ${p ? p.name : h.patientHn} · Score ${h.score}%</p>
          <p class="text-[11px] text-slate-400 mt-0.5">โดย ${h.doctor}</p>
        </div>`;
        })
        .join("") || `<p class="text-sm text-slate-400 text-center py-6">ยังไม่มีประวัติการจับคู่สำหรับผู้บริจาครายนี้</p>`;
  }

  function update() {
    const donor = D.donors.find((d) => d.id === document.getElementById("select-donor").value);
    const patient = D.waitingList.find((p) => p.hn === document.getElementById("select-patient").value);
    renderRecipient(patient);
    renderDonor(donor);
    renderScore(computeMatch(donor, patient));
    renderHistory(donor.id);
    lucide.createIcons();
  }

  document.getElementById("select-donor").addEventListener("change", update);
  document.getElementById("select-patient").addEventListener("change", update);
  document.getElementById("btn-reject-match").addEventListener("click", () => UI.toast("บันทึกการปฏิเสธการจับคู่เรียบร้อยแล้ว", "info"));

  // ตั้งค่าเริ่มต้นให้ตรงกับคู่ที่มีผล matching อยู่แล้ว
  document.getElementById("select-donor").value = D.matchingResults[0].donorId;
  document.getElementById("select-patient").value = D.matchingResults[0].patientHn;
  update();
</script>
</body>
</html>
