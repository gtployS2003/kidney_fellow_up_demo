<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ผลตรวจ Lab ผู้บริจาค | Kidney Transplant Follow-up System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body class="font-sans bg-bgapp text-slate-800">

<div class="flex min-h-screen">
  <div id="app-sidebar"></div>

  <div class="flex-1 min-w-0 flex flex-col">
    <div id="app-topbar"></div>

    <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Donor Laboratory</h2>
          <p id="header-sub" class="text-sm text-slate-500 mt-0.5"></p>
        </div>
        <div class="flex gap-2">
          <button class="flex items-center gap-2 px-3.5 py-2 rounded-lg border border-slate-200 bg-white text-sm font-medium text-slate-600 hover:bg-slate-50 transition"><i data-lucide="download" class="w-4 h-4"></i> ส่งออกผล PDF</button>
          <a href="donor-assessment.html" id="link-assessment" class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-medium transition"><i data-lucide="clipboard-check" class="w-4 h-4"></i> สรุปผลความเหมาะสม</a>
        </div>
      </div>

      <!-- Donor selector -->
      <div class="card p-4 fade-in flex flex-wrap items-center gap-3">
        <span class="text-sm font-medium text-slate-600 flex items-center gap-1.5"><i data-lucide="heart-handshake" class="w-4 h-4 text-slate-400"></i> เลือกผู้บริจาค:</span>
        <select id="donor-select" class="px-3.5 py-2 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white min-w-[240px]"></select>
      </div>

      <!-- Lab Dashboard (general) -->
      <div class="fade-in">
        <h3 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="flask-conical" class="w-4 h-4 text-primary"></i> Lab Dashboard</h3>
        <div id="lab-general-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </div>

      <!-- Compatibility Lab -->
      <div class="fade-in">
        <h3 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="git-compare-arrows" class="w-4 h-4 text-primary"></i> Compatibility Lab</h3>
        <div id="lab-compat-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </div>

      <!-- Infection Screening -->
      <div class="fade-in">
        <h3 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-primary"></i> Infection Screening</h3>
        <div id="lab-infection-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </div>

      <!-- Trend chart -->
      <div class="card p-5 fade-in">
        <div class="flex items-center justify-between mb-1">
          <div>
            <h3 class="font-semibold text-slate-800 text-sm">แนวโน้ม Creatinine &amp; eGFR ระหว่างประเมิน</h3>
            <p class="text-xs text-slate-400">ติดตามผลตรวจ 4 สัปดาห์ล่าสุดก่อนสรุปผล</p>
          </div>
        </div>
        <div class="h-72 mt-3"><canvas id="chart-donor-lab-trend"></canvas></div>
      </div>

      <!-- History table -->
      <div class="card p-5 fade-in">
        <h3 class="font-semibold text-slate-800 text-sm mb-4 flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-primary"></i> ประวัติผลตรวจระหว่างการประเมิน</h3>
        <div class="overflow-x-auto">
          <table class="table-modern">
            <thead><tr><th>สัปดาห์</th><th>Test</th><th>Result</th><th>Reference</th><th>Status</th></tr></thead>
            <tbody id="lab-history-tbody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
  StaffLayout.init({ role: "doctor", active: "donor-laboratory", title: "ผลตรวจ Lab ผู้บริจาค" });

  const D = window.MOCK_DATA;
  const donors = D.donors;

  const params = new URLSearchParams(window.location.search);
  const initialId = params.get("id") && donors.some((d) => d.id === params.get("id")) ? params.get("id") : donors[0].id;

  document.getElementById("donor-select").innerHTML = donors.map((d) => `<option value="${d.id}">${d.id} · ${d.name}</option>`).join("");
  document.getElementById("donor-select").value = initialId;

  let trendChart = null;

  function renderDonor(id) {
    const donor = donors.find((d) => d.id === id);
    const panel = D.donorLabPanels[id] || [];
    document.getElementById("header-sub").textContent = `${donor.name} · ${donor.id} · ${donor.type} · ${donor.age} ปี · กรุ๊ปเลือด ${donor.blood}`;
    document.getElementById("link-assessment").href = `donor-assessment.html?id=${id}`;

    const cardsFor = (group) => panel.filter((p) => p.group === group).map((p) => Components.medicalDataCard({ name: p.name, value: p.value, unit: p.unit, range: p.range, status: p.status })).join("");
    document.getElementById("lab-general-cards").innerHTML = cardsFor("general");
    document.getElementById("lab-compat-cards").innerHTML = cardsFor("compatibility");
    document.getElementById("lab-infection-cards").innerHTML = cardsFor("infection");

    const weeks = D.donorLabTrend.labels;
    const creatinine = D.donorLabTrend.creatinine[id] || [];
    const egfr = D.donorLabTrend.egfr[id] || [];

    if (trendChart) trendChart.destroy();
    trendChart = Charts.lineChart(document.getElementById("chart-donor-lab-trend"), {
      labels: weeks,
      datasets: [
        { label: "Creatinine (mg/dL)", data: creatinine, color: Charts.COLORS.red },
        { label: "eGFR (mL/min/1.73m²)", data: egfr, color: Charts.COLORS.primary, fill: true, fillColor: Charts.COLORS.primarySoft },
      ],
    });

    const historyRows = [];
    weeks.forEach((w, i) => {
      historyRows.push({ week: w, test: "Creatinine", result: `${creatinine[i]} mg/dL`, ref: "0.6 - 1.3", normal: creatinine[i] >= 0.6 && creatinine[i] <= 1.3 });
      historyRows.push({ week: w, test: "eGFR", result: `${egfr[i]} mL/min/1.73m²`, ref: "> 90", normal: egfr[i] > 90 });
    });
    document.getElementById("lab-history-tbody").innerHTML = historyRows
      .slice()
      .reverse()
      .map(
        (r) => `
      <tr>
        <td class="text-slate-500">${r.week}</td>
        <td class="font-medium text-slate-700">${r.test}</td>
        <td>${r.result}</td>
        <td class="text-slate-400">${r.ref}</td>
        <td>${r.normal ? '<span class="badge badge-green">ปกติ</span>' : '<span class="badge badge-red">ผิดปกติ</span>'}</td>
      </tr>`
      )
      .join("");

    lucide.createIcons();
  }

  document.getElementById("donor-select").addEventListener("change", (e) => renderDonor(e.target.value));
  renderDonor(initialId);
</script>
</body>
</html>
