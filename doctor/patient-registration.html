<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เพิ่มผู้ป่วยใหม่ | Kidney Transplant Follow-up System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="font-sans bg-bgapp text-slate-800">

<div class="flex min-h-screen">
  <div id="app-sidebar"></div>

  <div class="flex-1 min-w-0 flex flex-col">
    <div id="app-topbar"></div>

    <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1100px] w-full mx-auto">

      <!-- Breadcrumb -->
      <div class="flex items-center gap-1.5 text-xs text-slate-400 fade-in">
        <a href="patient-management.html" class="hover:text-primary hover:underline">จัดการผู้ป่วย</a>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
        <span class="text-slate-600 font-medium">เพิ่มผู้ป่วยใหม่</span>
      </div>

      <div class="fade-in">
        <h2 class="text-xl font-bold text-slate-800">เพิ่มผู้ป่วยใหม่</h2>
        <p class="text-sm text-slate-500 mt-0.5">กรอกข้อมูลผู้ป่วยปลูกถ่ายไตเพื่อลงทะเบียนเข้าสู่ระบบติดตาม</p>
      </div>

      <form id="registration-form" class="space-y-6">

        <!-- ข้อมูลทั่วไป -->
        <div class="card p-5 lg:p-6 fade-in fade-in-delay-1">
          <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2 mb-5"><i data-lucide="user-round" class="w-4 h-4 text-primary"></i> ข้อมูลทั่วไป</h3>
          <div class="grid md:grid-cols-2 gap-x-6 gap-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">ชื่อ-นามสกุล <span class="text-red-500">*</span></label>
              <input required type="text" placeholder="เช่น นายสมชาย ใจดี" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">เลข HN <span class="text-red-500">*</span></label>
              <input required type="text" placeholder="เช่น HN-102357" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">วันเกิด <span class="text-red-500">*</span></label>
              <input required type="date" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">เพศ</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>ชาย</option>
                <option>หญิง</option>
                <option>ไม่ระบุ</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">กรุ๊ปเลือด</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">เบอร์โทรศัพท์</label>
              <input type="tel" placeholder="เช่น 081-234-5678" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">LINE ID</label>
              <input type="text" placeholder="เช่น somchai_jd" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
          </div>
        </div>

        <!-- ข้อมูลโรงพยาบาล -->
        <div class="card p-5 lg:p-6 fade-in fade-in-delay-2">
          <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2 mb-5"><i data-lucide="hospital" class="w-4 h-4 text-primary"></i> ข้อมูลโรงพยาบาล</h3>
          <div class="grid md:grid-cols-2 gap-x-6 gap-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">โรงพยาบาล <span class="text-red-500">*</span></label>
              <select required class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>รพ.ศิริราช</option>
                <option>รพ.รามาธิบดี</option>
                <option>รพ.จุฬาลงกรณ์</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">แพทย์เจ้าของไข้</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>นพ.ธนกร วัฒนสิน</option>
                <option>พญ.ศิริพร แก้วเจริญ</option>
                <option>นพ.ปิยะ ชัยมงคล</option>
              </select>
            </div>
          </div>
        </div>

        <!-- ข้อมูลการปลูกถ่าย -->
        <div class="card p-5 lg:p-6 fade-in fade-in-delay-3">
          <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2 mb-5"><i data-lucide="dna" class="w-4 h-4 text-primary"></i> ข้อมูลการปลูกถ่าย</h3>
          <div class="grid md:grid-cols-2 gap-x-6 gap-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">วันที่ปลูกถ่าย <span class="text-red-500">*</span></label>
              <input required type="date" class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Donor Type</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>ญาติผู้บริจาค (Living Related)</option>
                <option>ผู้บริจาคสมองตาย (Deceased)</option>
                <option>ผู้บริจาคไม่ใช่ญาติ (Living Unrelated)</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">HLA Matching</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>6/6 Match</option><option>5/6 Match</option><option>4/6 Match</option><option>3/6 Match</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1.5">Compatibility</label>
              <select class="w-full px-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white">
                <option>สูงมาก</option><option>สูง</option><option>ปานกลาง</option><option>ต่ำ</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex justify-end gap-3 fade-in fade-in-delay-4 pb-6">
          <a href="patient-management.html" class="px-5 py-2.5 text-sm rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition font-medium">ยกเลิก</a>
          <button type="submit" class="flex items-center gap-2 px-5 py-2.5 text-sm rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold transition shadow-sm shadow-blue-200">
            <i data-lucide="save" class="w-4 h-4"></i> บันทึกข้อมูล
          </button>
        </div>

      </form>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  StaffLayout.init({ role: "doctor", active: "patients", title: "เพิ่มผู้ป่วยใหม่" });

  document.getElementById("registration-form").addEventListener("submit", function (e) {
    e.preventDefault();
    UI.toast("บันทึกข้อมูลผู้ป่วยสำเร็จ", "success");
    setTimeout(() => (window.location.href = "patient-management.html"), 900);
  });

  lucide.createIcons();
</script>
</body>
</html>
