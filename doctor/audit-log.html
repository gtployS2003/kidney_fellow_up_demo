<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Log | Kidney Transplant Follow-up System</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="font-sans bg-bgapp text-slate-800">

<div class="flex min-h-screen">
  <div id="app-sidebar"></div>

  <div class="flex-1 min-w-0 flex flex-col">
    <div id="app-topbar"></div>

    <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

      <!-- Header -->
      <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
        <div>
          <h2 class="text-xl font-bold text-slate-800">Audit Log</h2>
          <p class="text-sm text-slate-500 mt-0.5">บันทึกประวัติการใช้งานระบบของผู้ใช้งานทั้งหมดเพื่อการตรวจสอบย้อนหลัง</p>
        </div>
        <button class="flex items-center gap-2 px-3.5 py-2 rounded-lg border border-slate-200 bg-white text-sm font-medium text-slate-600 hover:bg-slate-50 transition"><i data-lucide="download" class="w-4 h-4"></i> ส่งออกรายงาน</button>
      </div>

      <!-- Filter bar -->
      <div class="card p-4 fade-in">
        <div class="grid md:grid-cols-4 gap-3">
          <div class="relative md:col-span-1">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" placeholder="ค้นหาผู้ใช้งาน..." class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
          </div>
          <div>
            <select class="w-full px-3.5 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white text-slate-600">
              <option>บทบาททั้งหมด</option>
              <option>แพทย์</option>
              <option>พยาบาล</option>
              <option>ผู้ดูแลระบบ</option>
            </select>
          </div>
          <div class="relative">
            <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" value="01 ก.ย. 2569" placeholder="วันที่เริ่มต้น" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
          </div>
          <div class="relative">
            <i data-lucide="calendar" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" value="09 ก.ย. 2569" placeholder="วันที่สิ้นสุด" class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition" />
          </div>
        </div>
      </div>

      <!-- Table -->
      <div class="card p-5 fade-in">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-primary"></i> ประวัติการใช้งานระบบ</h3>
          <span id="row-count" class="badge badge-blue"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="table-modern">
            <thead>
              <tr>
                <th>ผู้ใช้งาน</th>
                <th>บทบาท</th>
                <th>การดำเนินการ</th>
                <th>วัน-เวลา</th>
                <th>IP Address</th>
              </tr>
            </thead>
            <tbody id="audit-tbody"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div class="flex flex-wrap items-center justify-between gap-3 mt-5 pt-4 border-t border-slate-100">
          <p class="text-xs text-slate-500">แสดง 1-<span id="pg-count"></span> จาก <span id="pg-total"></span> รายการ</p>
          <div class="flex items-center gap-1.5">
            <button class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-slate-50" disabled><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <button class="w-8 h-8 rounded-lg bg-primary text-white text-xs font-semibold">1</button>
            <button class="w-8 h-8 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">2</button>
            <button class="w-8 h-8 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">3</button>
            <span class="px-1 text-slate-400 text-xs">…</span>
            <button class="w-8 h-8 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">8</button>
            <button class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  StaffLayout.init({ role: "doctor", active: "audit", title: "Audit Log" });

  const D = window.MOCK_DATA;
  const logs = D.auditLogs;

  const roleBadge = { "แพทย์": "badge-blue", "พยาบาล": "badge-teal", "ผู้ดูแลระบบ": "badge-slate" };

  function actionIcon(action) {
    if (action.includes("เข้าสู่ระบบ")) return { icon: "log-in", cls: "bg-blue-50 text-primary" };
    if (action.includes("แก้ไข")) return { icon: "pencil", cls: "bg-amber-50 text-amber-600" };
    if (action.includes("สำรองข้อมูล")) return { icon: "database", cls: "bg-slate-100 text-slate-600" };
    if (action.includes("อนุมัติ")) return { icon: "badge-check", cls: "bg-green-50 text-green-600" };
    if (action.includes("เพิ่ม")) return { icon: "plus-circle", cls: "bg-teal-50" };
    if (action.includes("บันทึก")) return { icon: "clipboard-list", cls: "bg-blue-50 text-primary" };
    return { icon: "activity", cls: "bg-slate-100 text-slate-600" };
  }

  document.getElementById("row-count").textContent = `${logs.length} รายการ`;
  document.getElementById("pg-count").textContent = logs.length;
  document.getElementById("pg-total").textContent = logs.length * 8;

  document.getElementById("audit-tbody").innerHTML = logs
    .map((l) => {
      const a = actionIcon(l.action);
      return `
      <tr>
        <td>
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${l.user.slice(0, 2)}</div>
            <span class="font-medium text-slate-800">${l.user}</span>
          </div>
        </td>
        <td><span class="badge ${roleBadge[l.role] || "badge-slate"}">${l.role}</span></td>
        <td>
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg ${a.cls} flex items-center justify-center shrink-0" style="${a.icon === "plus-circle" ? "color:#0f766e" : ""}"><i data-lucide="${a.icon}" class="w-3.5 h-3.5"></i></div>
            <span class="text-slate-700">${l.action}</span>
          </div>
        </td>
        <td class="text-slate-500">${l.datetime}</td>
        <td class="text-slate-500 font-mono text-xs">${l.ip}</td>
      </tr>`;
    })
    .join("");

  lucide.createIcons();
</script>
</body>
</html>
