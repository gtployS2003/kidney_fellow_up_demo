<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>โปรไฟล์ของฉัน | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="liff-body font-sans">
<div class="liff-shell">
  <div id="liff-header"></div>

  <main class="flex-1 overflow-y-auto min-h-0 p-4 space-y-4">

    <!-- Profile header card -->
    <div class="card p-5 flex flex-col items-center text-center fade-in">
      <div id="pf-avatar" class="w-20 h-20 rounded-full bg-primary text-white flex items-center justify-center text-2xl font-bold shrink-0"></div>
      <p id="pf-name" class="text-lg font-extrabold text-slate-800 mt-3"></p>
      <p id="pf-hn" class="text-xs text-slate-500 mt-0.5"></p>
      <span class="badge badge-green mt-2"><i data-lucide="check-circle-2" class="w-3 h-3"></i> ปลูกถ่ายไตสำเร็จ</span>
    </div>

    <!-- Info list -->
    <div class="fade-in fade-in-delay-1">
      <div class="flex items-center justify-between mb-2">
        <p class="text-sm font-bold text-slate-700">ข้อมูลส่วนตัว</p>
        <button id="btn-edit-profile" class="liff-tap flex items-center gap-1 text-xs font-semibold text-primary"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> แก้ไขข้อมูล</button>
      </div>
      <div class="card divide-y divide-slate-100" id="pf-info"></div>
    </div>

    <!-- Settings menu -->
    <div class="fade-in fade-in-delay-2">
      <p class="text-sm font-bold text-slate-700 mb-2">การตั้งค่า</p>
      <div class="card divide-y divide-slate-100" id="pf-settings"></div>
    </div>

    <!-- Logout -->
    <button class="w-full py-3.5 rounded-xl bg-red-50 text-red-600 font-bold text-sm liff-tap flex items-center justify-center gap-2 fade-in fade-in-delay-3" onclick="UI.toast('ออกจากระบบเรียบร้อยแล้ว (ตัวอย่างระบบสาธิต)','info')">
      <i data-lucide="log-out" class="w-4.5 h-4.5"></i> ออกจากระบบ
    </button>

  </main>

  <div id="liff-bottomnav"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", active: "profile", title: "โปรไฟล์ของฉัน", backHref: "home.html" });

  const p = window.MOCK_DATA.primaryPatient;
  document.getElementById("pf-avatar").textContent = p.name.slice(0, 2);
  document.getElementById("pf-name").textContent = p.name;
  document.getElementById("pf-hn").textContent = `HN: ${p.hn}`;

  const infoRows = [
    { icon: "user", label: "ชื่อ-สกุล", value: p.name },
    { icon: "badge", label: "เลขประจำตัวผู้ป่วย (HN)", value: p.hn },
    { icon: "cake", label: "วันเกิด", value: p.dob },
    { icon: "droplet", label: "กรุ๊ปเลือด", value: p.blood },
    { icon: "hospital", label: "โรงพยาบาล", value: p.hospital },
    { icon: "phone", label: "เบอร์โทรศัพท์", value: p.phone },
    { icon: "message-circle", label: "LINE Account", value: p.line },
  ];

  function infoRow(r) {
    return `
    <div class="flex items-center gap-3 p-3.5">
      <div class="w-9 h-9 rounded-lg bg-blue-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="${r.icon}" class="w-4.5 h-4.5"></i></div>
      <p class="text-xs text-slate-500 w-28 shrink-0">${r.label}</p>
      <p class="text-sm font-semibold text-slate-800 flex-1 min-w-0 text-right truncate">${r.value}</p>
    </div>`;
  }
  document.getElementById("pf-info").innerHTML = infoRows.map(infoRow).join("");

  const settingsRows = [
    { icon: "bell", label: "การแจ้งเตือน" },
    { icon: "lock", label: "ความเป็นส่วนตัว" },
    { icon: "phone-call", label: "ติดต่อโรงพยาบาล" },
    { icon: "help-circle", label: "ช่วยเหลือ" },
  ];
  function settingRow(r) {
    return `
    <button class="w-full flex items-center gap-3 p-3.5 liff-tap text-left">
      <div class="w-9 h-9 rounded-lg bg-slate-50 text-slate-500 flex items-center justify-center shrink-0"><i data-lucide="${r.icon}" class="w-4.5 h-4.5"></i></div>
      <p class="text-sm font-medium text-slate-700 flex-1">${r.label}</p>
      <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300 shrink-0"></i>
    </button>`;
  }
  document.getElementById("pf-settings").innerHTML = settingsRows.map(settingRow).join("");

  document.getElementById("btn-edit-profile").addEventListener("click", () => UI.toast("ฟีเจอร์แก้ไขข้อมูลอยู่ระหว่างพัฒนา", "info"));

  lucide.createIcons();
</script>
</body>
</html>
