<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>แชทกับทีมพยาบาล | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="liff-body font-sans">
<div class="liff-shell">
  <div id="liff-header"></div>

  <main class="flex-1 overflow-y-auto min-h-0 flex flex-col p-0">

    <!-- Nurse mini header -->
    <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-slate-100 shrink-0 fade-in">
      <div class="w-11 h-11 rounded-full bg-teal-100 flex items-center justify-center font-bold text-sm shrink-0" style="color:#0f766e" id="chat-avatar"></div>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-bold text-slate-800" id="chat-name"></p>
        <p class="text-xs text-slate-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span><span id="chat-role"></span></p>
      </div>
      <a href="tel:0821234567" class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center liff-tap"><i data-lucide="phone" class="w-4 h-4 text-slate-500"></i></a>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/60"></div>

    <!-- Quick Message -->
    <div class="px-3 pt-2 flex items-center gap-1.5 overflow-x-auto shrink-0">
      <button data-quick-msg="ขอสอบถามเรื่องยา" class="chip-btn shrink-0 px-3 py-1.5 rounded-full text-xs border border-slate-200 text-slate-600 bg-white liff-tap">ขอสอบถามเรื่องยา</button>
      <button data-quick-msg="มีอาการผิดปกติ" class="chip-btn shrink-0 px-3 py-1.5 rounded-full text-xs border border-slate-200 text-slate-600 bg-white liff-tap">มีอาการผิดปกติ</button>
      <button data-quick-msg="ขอเลื่อนนัด" class="chip-btn shrink-0 px-3 py-1.5 rounded-full text-xs border border-slate-200 text-slate-600 bg-white liff-tap">ขอเลื่อนนัด</button>
    </div>

    <!-- Composer -->
    <div class="p-3 border-t border-slate-100 bg-white shrink-0">
      <div class="flex items-center gap-2">
        <button id="btn-attach-image" class="p-2.5 rounded-full hover:bg-slate-100 text-slate-500 liff-tap shrink-0" title="แนบรูปภาพ"><i data-lucide="image" class="w-5 h-5"></i></button>
        <button id="btn-attach-doc" class="p-2.5 rounded-full hover:bg-slate-100 text-slate-500 liff-tap shrink-0" title="แนบเอกสาร"><i data-lucide="paperclip" class="w-5 h-5"></i></button>
        <input id="chat-input" type="text" placeholder="พิมพ์ข้อความ..." class="flex-1 px-3.5 py-2.5 text-sm rounded-full border border-slate-200 bg-slate-50 focus:bg-white focus:border-primary outline-none" />
        <button id="btn-send-chat" class="p-2.5 rounded-full bg-primary text-white liff-tap shrink-0"><i data-lucide="send" class="w-4.5 h-4.5"></i></button>
      </div>
    </div>

  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", title: "แชทกับทีมพยาบาล", backHref: "home.html" });

  const nurse = window.MOCK_DATA.staff.nurse;
  document.getElementById("chat-avatar").textContent = nurse.avatar;
  document.getElementById("chat-name").textContent = nurse.name;
  document.getElementById("chat-role").textContent = nurse.roleLabel;

  // from: "nurse" (ซ้าย) / "me" (ขวา, ผู้ป่วย)
  const sampleMessages = [
    { from: "nurse", text: "สวัสดีค่ะคุณสมชาย วันนี้รู้สึกเป็นอย่างไรบ้างคะ ทานยาครบตามเวลาไหมคะ", time: "09:15" },
    { from: "me", text: "สวัสดีครับพยาบาล ทานยาครบทุกมื้อเลยครับ วันนี้รู้สึกสบายดี", time: "09:18" },
    { from: "nurse", text: "ดีมากค่ะ แล้วมีอาการบวม เหนื่อยง่าย หรือปัสสาวะผิดปกติไหมคะ", time: "09:19" },
    { from: "me", text: "ไม่มีครับ แต่สังเกตว่าช่วงนี้ความดันสูงขึ้นนิดหน่อยตอนวัดที่บ้าน", time: "09:22" },
    { from: "nurse", text: "รับทราบค่ะ ลองวัดความดันต่อเนื่องอีก 2-3 วันแล้วส่งค่าให้ดูนะคะ ถ้าสูงเกิน 140/90 ให้แจ้งมาทันทีค่ะ", time: "09:24" },
  ];

  function bubble(m) {
    const mine = m.from === "me";
    return `
    <div class="flex ${mine ? "justify-end" : "justify-start"}">
      <div class="max-w-[75%]">
        <div class="${mine ? "bg-primary text-white rounded-2xl rounded-tr-sm" : "bg-white border border-slate-200 text-slate-700 rounded-2xl rounded-tl-sm"} px-4 py-2.5 text-sm shadow-sm leading-relaxed">${m.text}</div>
        <p class="text-[11px] text-slate-400 mt-1 ${mine ? "text-right" : ""}">${m.time}</p>
      </div>
    </div>`;
  }

  const wrap = document.getElementById("chat-messages");
  wrap.innerHTML = sampleMessages.map(bubble).join("");

  function sendMsg() {
    const input = document.getElementById("chat-input");
    if (!input.value.trim()) return;
    const now = new Date();
    const time = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
    wrap.insertAdjacentHTML("beforeend", bubble({ from: "me", text: input.value, time }));
    wrap.scrollTop = wrap.scrollHeight;
    input.value = "";
    lucide.createIcons();
  }
  document.getElementById("btn-send-chat").addEventListener("click", sendMsg);
  document.getElementById("chat-input").addEventListener("keydown", (e) => e.key === "Enter" && sendMsg());

  document.querySelectorAll("[data-quick-msg]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.getElementById("chat-input").value = btn.getAttribute("data-quick-msg");
      document.getElementById("chat-input").focus();
    });
  });

  document.getElementById("btn-attach-image").addEventListener("click", () => UI.toast("ฟีเจอร์แนบรูปภาพอยู่ระหว่างพัฒนา", "info"));
  document.getElementById("btn-attach-doc").addEventListener("click", () => UI.toast("ฟีเจอร์แนบเอกสารอยู่ระหว่างพัฒนา", "info"));

  lucide.createIcons();
  wrap.scrollTop = wrap.scrollHeight;
</script>
</body>
</html>
