<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Timeline การรักษา | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>

    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>

<body class="liff-body font-sans">
<div class="liff-shell">

    <div class="rounded-xl bg-indigo-50 border border-indigo-100 p-3.5 flex items-center gap-2.5 fade-in">

  </main>

  <div id="liff-bottomnav"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", title: "Timeline การรักษา", backHref: "home.html" });

  document.getElementById("timeline-list").innerHTML = Components.timeline(window.MOCK_DATA.timelineEvents);
