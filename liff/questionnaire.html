<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>แบบสอบถามอาการ | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="liff-body font-sans">
<div class="liff-shell">
  <div id="liff-header"></div>

  <main class="flex-1 overflow-y-auto min-h-0 p-4 space-y-4">

    <div class="rounded-xl bg-blue-50 border border-blue-100 p-3.5 flex items-center gap-2.5 fade-in">
      <i data-lucide="clipboard-list" class="w-4.5 h-4.5 text-primary shrink-0"></i>
      <p class="text-xs text-blue-800">กรุณาตอบตามอาการจริงในช่วง 2-3 วันที่ผ่านมา เพื่อให้พยาบาลติดตามอาการได้ถูกต้อง</p>
    </div>

    <div id="questions" class="space-y-3"></div>

    <div class="fade-in fade-in-delay-4">
      <p class="text-sm font-bold text-slate-700 mb-2">แนบรูปภาพ (ถ้ามี)</p>
      <div class="grid grid-cols-3 gap-3">
        <label class="liff-tap flex flex-col items-center justify-center gap-1.5 py-5 rounded-xl border-2 border-dashed border-slate-300 bg-white cursor-pointer">
          <i data-lucide="scissors" class="w-6 h-6 text-slate-400"></i>
          <span class="text-[11px] font-medium text-slate-500 text-center leading-tight">รูปแผลผ่าตัด</span>
          <input type="file" accept="image/*" class="hidden" onchange="fileChosen(this,'แผลผ่าตัด')" />
        </label>
        <label class="liff-tap flex flex-col items-center justify-center gap-1.5 py-5 rounded-xl border-2 border-dashed border-slate-300 bg-white cursor-pointer">
          <i data-lucide="pill" class="w-6 h-6 text-slate-400"></i>
          <span class="text-[11px] font-medium text-slate-500 text-center leading-tight">รูปยา</span>
          <input type="file" accept="image/*" class="hidden" onchange="fileChosen(this,'ยา')" />
        </label>
        <label class="liff-tap flex flex-col items-center justify-center gap-1.5 py-5 rounded-xl border-2 border-dashed border-slate-300 bg-white cursor-pointer">
          <i data-lucide="flask-conical" class="w-6 h-6 text-slate-400"></i>
          <span class="text-[11px] font-medium text-slate-500 text-center leading-tight">ผลตรวจ</span>
          <input type="file" accept="image/*" class="hidden" onchange="fileChosen(this,'ผลตรวจ')" />
        </label>
      </div>
      <div id="file-status" class="mt-2 space-y-1"></div>
    </div>

    <button id="btn-submit" class="liff-tap w-full py-4 rounded-2xl bg-primary text-white text-base font-bold flex items-center justify-center gap-2 shadow-sm fade-in fade-in-delay-4">
      <i data-lucide="send" class="w-5 h-5"></i> ส่งแบบสอบถาม
    </button>

  </main>

  <div id="liff-bottomnav"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", title: "แบบสอบถามอาการ", backHref: "home.html" });

  const questions = window.MOCK_DATA.symptomQuestions;

  const answers = {};

  function renderQuestion(q, idx) {
    return `
    <div class="card p-4 fade-in">
      <div class="flex items-center gap-2.5 mb-3">
        <div class="w-9 h-9 rounded-lg bg-blue-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="${q.icon}" class="w-4.5 h-4.5"></i></div>
        <p class="text-sm font-semibold text-slate-800 flex-1">${idx + 1}. ${q.text}</p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" data-q="${q.key}" data-val="no" onclick="selectAnswer(this)" class="ans-btn liff-tap py-3 rounded-xl text-sm font-bold border-2 border-slate-200 text-slate-600">ไม่มี</button>
        <button type="button" data-q="${q.key}" data-val="yes" onclick="selectAnswer(this)" class="ans-btn liff-tap py-3 rounded-xl text-sm font-bold border-2 border-slate-200 text-slate-600">มี</button>
      </div>
    </div>`;
  }

  document.getElementById("questions").innerHTML = questions.map(renderQuestion).join("");

  function selectAnswer(btn) {
    const q = btn.getAttribute("data-q");
    const val = btn.getAttribute("data-val");
    answers[q] = val;
    document.querySelectorAll(`.ans-btn[data-q="${q}"]`).forEach((b) => {
      b.classList.remove("bg-primary", "text-white", "border-primary", "bg-red-500", "border-red-500");
    });
    if (val === "yes") {
      btn.classList.add("bg-red-500", "text-white", "border-red-500");
    } else {
      btn.classList.add("bg-primary", "text-white", "border-primary");
    }
  }

  function fileChosen(input, label) {
    if (!input.files || !input.files.length) return;
    const status = document.getElementById("file-status");
    const row = document.createElement("div");
    row.className = "flex items-center gap-1.5 text-xs text-green-700";
    row.innerHTML = `<i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> แนบ${label}แล้ว: ${input.files[0].name}`;
    status.appendChild(row);
    lucide.createIcons();
  }

  document.getElementById("btn-submit").addEventListener("click", () => {
    UI.toast("ส่งแบบสอบถามสำเร็จ ขอบคุณค่ะ");
    setTimeout(() => { window.location.href = "home.html"; }, 1200);
  });

  lucide.createIcons();
</script>
</body>
</html>
