<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>ยาของฉัน | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="liff-body font-sans">
<div class="liff-shell">
  <div id="liff-header"></div>

  <main class="flex-1 overflow-y-auto min-h-0 p-4 space-y-4">

    <div class="rounded-xl bg-blue-50 border border-blue-100 p-3.5 flex items-center gap-2.5 fade-in">
      <i data-lucide="info" class="w-4.5 h-4.5 text-primary shrink-0"></i>
      <p class="text-xs text-blue-800">การกินยากดภูมิคุ้มกันตรงเวลาทุกวันมีความสำคัญมากต่อการทำงานของไตที่ปลูกถ่าย</p>
    </div>

    <div class="fade-in fade-in-delay-1">
      <p class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-1.5"><i data-lucide="sunrise" class="w-4 h-4 text-amber-500"></i> มื้อเช้า</p>
      <div id="med-morning" class="space-y-3"></div>
    </div>

    <div class="fade-in fade-in-delay-2">
      <p class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-1.5"><i data-lucide="sunset" class="w-4 h-4 text-indigo-500"></i> มื้อเย็น</p>
      <div id="med-evening" class="space-y-3"></div>
    </div>

  </main>

  <div id="liff-bottomnav"></div>
</div>

<!-- Modal: Medication Detail -->
<div id="modal-med-detail" class="modal-overlay hidden" data-modal-overlay>
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
      <h3 class="font-bold text-slate-800 text-base" id="md-drug-name"></h3>
      <button data-close-modal="modal-med-detail" class="p-1.5 rounded-lg hover:bg-slate-100 liff-tap"><i data-lucide="x" class="w-5 h-5 text-slate-500"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div class="flex items-center gap-4 text-sm">
        <div><p class="text-xs text-slate-400">ขนาดยา</p><p class="font-semibold text-slate-700 mt-0.5" id="md-dose"></p></div>
        <div><p class="text-xs text-slate-400">จำนวนเม็ด</p><p class="font-semibold text-slate-700 mt-0.5" id="md-count"></p></div>
      </div>
      <div>
        <p class="text-xs font-semibold text-slate-600 mb-1 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5 text-primary"></i> วิธีกิน</p>
        <p class="text-sm text-slate-600 leading-relaxed" id="md-instructions"></p>
      </div>
      <div class="rounded-xl bg-amber-50 border border-amber-100 p-3.5 flex items-start gap-2.5">
        <i data-lucide="alert-triangle" class="w-4.5 h-4.5 text-amber-600 shrink-0 mt-0.5"></i>
        <p class="text-xs text-amber-800 leading-relaxed" id="md-warning"></p>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", active: "medication", title: "ยาของฉัน", backHref: "home.html" });

  const meds = window.MOCK_DATA.medications.filter((m) => m.status === "active");

  function medBlock(m, time, taken) {
    return `
    <div data-detail="${m.drug}">
      ${Components.medicationReminderCard({ drug: m.drug, dose: m.dose, mealTime: m.frequency, time, taken, onTakenClick: taken ? undefined : "medMarkTaken(this)" })}
      <button data-open-detail="${m.drug}" class="liff-tap w-full -mt-1 mb-1 text-center text-xs font-semibold text-primary py-2">ดูรายละเอียดยา</button>
    </div>`;
  }

  document.getElementById("med-morning").innerHTML = meds.map((m) => medBlock(m, "08:00 น.", true)).join("");
  document.getElementById("med-evening").innerHTML = meds.map((m) => medBlock(m, "20:00 น.", false)).join("");

  function medMarkTaken(btn) {
    UI.toast("บันทึกว่ากินยาแล้ว ขอบคุณค่ะ");
    btn.outerHTML = `<span class="badge badge-green w-full justify-center py-2.5 text-xs"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> กินยาแล้ว</span>`;
    lucide.createIcons();
  }

  document.querySelectorAll("[data-open-detail]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const m = meds.find((x) => x.drug === btn.getAttribute("data-open-detail"));
      document.getElementById("md-drug-name").textContent = m.drug;
      document.getElementById("md-dose").textContent = m.dose;
      document.getElementById("md-count").textContent = m.pillCount || "-";
      document.getElementById("md-instructions").textContent = m.instructions || "-";
      document.getElementById("md-warning").textContent = m.warning || "ไม่มีข้อควรระวังพิเศษ";
      UI.openModal("modal-med-detail");
      lucide.createIcons();
    });
  });

  lucide.createIcons();
</script>
</body>
</html>
