<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>การแจ้งเตือนยา | Kidney Transplant LIFF</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
        fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>
<body class="liff-body font-sans">
<div class="liff-shell">
  <div id="liff-header"></div>

  <main class="flex-1 overflow-y-auto min-h-0 p-4 flex flex-col justify-center space-y-6">

    <div class="fade-in rounded-3xl p-6 text-center shadow-md" style="background:linear-gradient(150deg,#eff6ff,#f0fdfa);">
      <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center shadow-sm" style="background:linear-gradient(135deg,#2563eb,#0f766e);">
        <i data-lucide="pill" class="w-10 h-10 text-white"></i>
      </div>
      <p class="text-lg font-bold text-slate-800 mt-4">ถึงเวลาทาน Tacrolimus</p>
      <p class="text-sm text-slate-500 mt-1">แจ้งเตือนจาก LINE · ระบบติดตามผู้ป่วยปลูกถ่ายไต</p>

      <div class="mt-5 bg-white/80 rounded-2xl p-4 text-left space-y-2.5 border border-white">
        <div class="flex items-center gap-2.5">
          <i data-lucide="pill" class="w-4.5 h-4.5 text-primary shrink-0"></i>
          <p class="text-sm text-slate-700"><span class="font-semibold">ขนาดยา:</span> Tacrolimus (Prograf) 2 mg</p>
        </div>
        <div class="flex items-center gap-2.5">
          <i data-lucide="clock" class="w-4.5 h-4.5 text-primary shrink-0"></i>
          <p class="text-sm text-slate-700"><span class="font-semibold">เวลา:</span> 20:00 น. · มื้อเย็น หลังอาหาร</p>
        </div>
      </div>
    </div>

    <div class="fade-in fade-in-delay-1 space-y-3">
      <button id="btn-taken" class="liff-tap w-full py-4 rounded-2xl bg-primary text-white text-base font-bold flex items-center justify-center gap-2 shadow-sm">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i> กินยาแล้ว
      </button>
      <button id="btn-ack" class="liff-tap w-full py-4 rounded-2xl bg-white border-2 border-slate-200 text-slate-600 text-base font-bold flex items-center justify-center gap-2">
        <i data-lucide="bell-off" class="w-5 h-5"></i> ลืมกินยา
      </button>
    </div>

    <!-- Compliance Summary -->
    <div class="card p-5 fade-in fade-in-delay-2 flex items-center gap-5">
      <div id="compliance-ring" class="shrink-0"></div>
      <div class="min-w-0">
        <p class="text-sm font-bold text-slate-700">การกินยาของคุณ</p>
        <p class="text-xs text-slate-500 mt-1 leading-relaxed">อัตราการกินยาตรงเวลาในช่วง 30 วันที่ผ่านมา ยิ่งกินยาสม่ำเสมอ ยิ่งช่วยให้ไตใหม่ทำงานได้ดี</p>
      </div>
    </div>

  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/liff-layout.js"></script>
<script src="../assets/js/components.js"></script>
<script>
  LiffLayout.init({ variant: "plain", title: "การแจ้งเตือนยา", backHref: "home.html" });

  function goHome(msg) {
    UI.toast(msg);
    setTimeout(() => { window.location.href = "home.html"; }, 1200);
  }

  document.getElementById("btn-taken").addEventListener("click", () => goHome("บันทึกว่ากินยาแล้ว ขอบคุณค่ะ"));
  document.getElementById("btn-ack").addEventListener("click", () => goHome("บันทึกว่าลืมกินยา ระบบจะแจ้งเตือนพยาบาลผู้ประสานงาน"));

  // Compliance Summary — Progress Circle (ใช้ CSS ร่วมกับ Components.matchingScore)
  const compliancePercent = 95;
  (function renderComplianceRing() {
    const size = 84, stroke = 8;
    const radius = (size - stroke) / 2;
    const circumference = 2 * Math.PI * radius;
    const offset = circumference * (1 - compliancePercent / 100);
    document.getElementById("compliance-ring").innerHTML = `
      <div class="score-ring-wrap" style="width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}">
          <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="#e2e8f0" stroke-width="${stroke}" />
          <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="#16a34a" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" style="transition:stroke-dashoffset .6s ease" />
        </svg>
        <div class="score-ring-value"><span class="text-lg font-bold text-slate-800">${compliancePercent}%</span></div>
      </div>`;
  })();

  lucide.createIcons();
</script>
</body>
</html>
