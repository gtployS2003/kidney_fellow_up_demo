<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ก่อนกลับบ้าน | Kidney Transplant Follow-up System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
          fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
  <style>
    .tab-btn { padding: .7rem 1.1rem; font-size: .8rem; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s ease; }
    .tab-btn:hover { color: #1e293b; }
    .tab-btn.tab-active { color: #2563eb; border-color: #2563eb; }
    .field-label { display:block; font-size:.75rem; font-weight:600; color:#374151; margin-bottom:.35rem; }
    .field-input { width:100%; padding:.55rem .7rem; font-size:.8rem; border-radius:.5rem; border:1px solid #cbd5e1; outline:none; transition:.15s; }
    .field-input:focus { border-color:#2563eb; box-shadow:0 0 0 2px rgba(37,99,235,.12); }
  </style>
</head>

<body class="font-sans bg-bgapp text-slate-800">

  <div class="flex min-h-screen">
    <div id="app-sidebar"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <div id="app-topbar"></div>

      <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-5xl w-full mx-auto">

        <!-- Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
          <div>
            <h2 class="text-xl font-bold text-slate-800">ก่อนกลับบ้าน — Discharge Checklist</h2>
            <p class="text-sm text-slate-500 mt-0.5">ประเมินความพร้อมก่อนกลับบ้านของทั้งผู้บริจาคและผู้รับในเคสเดียวกัน
              พร้อมคำแนะนำและนัด Follow-up ครั้งแรก</p>
          </div>
        </div>

        <!-- Case selector -->
        <div class="card p-4 fade-in flex flex-wrap items-center gap-3">
          <span class="text-sm font-medium text-slate-600 flex items-center gap-1.5"><i data-lucide="link"
              class="w-4 h-4 text-slate-400"></i> เลือกเคสปลูกถ่าย:</span>
          <select id="case-select"
            class="px-3.5 py-2 text-sm rounded-lg border border-slate-300 focus:border-primary focus:ring-2 focus:ring-blue-100 outline-none transition bg-white min-w-[320px]"></select>
        </div>

        <!-- Tabs -->
        <div class="card fade-in overflow-hidden">
          <div data-tabs data-tabs-target="#tab-panels" class="flex overflow-x-auto border-b border-slate-200 px-2">
            <button data-tab-btn="donor" class="tab-btn tab-active">ผู้บริจาค</button>
            <button data-tab-btn="recipient" class="tab-btn">ผู้รับ</button>
          </div>

          <div id="tab-panels" class="p-5">
            <div data-tab-panel="donor">
              <div id="donor-discharge-panel" class="space-y-5"></div>
            </div>
            <div data-tab-panel="recipient" class="hidden">
              <div id="recipient-discharge-panel" class="space-y-5"></div>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-2">
          <button id="btn-save" type="button"
            class="px-5 py-2 text-sm rounded-lg bg-primary hover:bg-primary-dark text-white font-medium flex items-center gap-2"><i
              data-lucide="save" class="w-4 h-4"></i> บันทึกความพร้อมก่อนกลับบ้าน</button>
        </div>

      </main>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    StaffLayout.init({ role: "doctor", active: "transplant-discharge", title: "ก่อนกลับบ้าน" });

    const D = window.MOCK_DATA;
    const cases = D.transplantCases;

    const params = new URLSearchParams(window.location.search);
    const initialCaseId = params.get("case") && cases.some((c) => c.caseId === params.get("case")) ? params.get("case") : cases[0].caseId;

    document.getElementById("case-select").innerHTML = cases
      .map((c) => `<option value="${c.caseId}">${c.caseId} · ${D.donors.find((d) => d.id === c.donorId).name} → ${c.recipientName}</option>`)
      .join("");
    document.getElementById("case-select").value = initialCaseId;

    function field(label, value) {
      return `<div><label class="field-label">${label}</label><input type="text" class="field-input" value="${value ?? ""}" /></div>`;
    }
    function checkRow(label, checked) {
      return `<label class="flex items-center gap-2.5 rounded-xl border border-slate-200 p-3 text-sm"><input type="checkbox" ${checked ? "checked" : ""} class="w-4 h-4 text-primary rounded" /> ${label}</label>`;
    }
    function adviceList(title, items) {
      return `<div><p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">${title}</p><ul class="space-y-1.5">${items.map((a) => `<li class="text-sm text-slate-600 flex items-start gap-2"><i data-lucide="check" class="w-3.5 h-3.5 text-green-600 mt-0.5 shrink-0"></i>${a}</li>`).join("")}</ul></div>`;
    }
    function drugLevelTable(rows) {
      return `
      <div class="overflow-x-auto">
        <table class="table-modern">
          <thead><tr><th>ยา</th><th>เป้าหมาย</th><th>ผลตรวจ</th><th>สถานะ</th></tr></thead>
          <tbody>
            ${rows.map((r) => `<tr><td class="font-medium text-slate-700">${r.drug}</td><td>${r.target}</td><td>${r.value}</td><td>${Components.checklistStatusBadge(r.status)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>`;
    }

    function loadCase(caseId) {
      const c = cases.find((x) => x.caseId === caseId);
      const donor = D.donors.find((d) => d.id === c.donorId);
      const dd = c.donorDischarge;
      const rd = c.recipientDischarge;

      document.getElementById("donor-discharge-panel").innerHTML = `
      <div class="rounded-xl border border-slate-100 p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center shrink-0" style="color:#0f766e"><i data-lucide="heart-handshake" class="w-5 h-5"></i></div>
        <div><p class="font-bold text-slate-800">${donor.name}</p><p class="text-xs text-slate-500">${donor.id} · ${donor.type}</p></div>
      </div>
      ${Components.checklistSection({ title: "ประเมินการทำงานของไตที่เหลือ", icon: "flask-conical", items: dd.labs }, { editable: true })}
      <div class="grid sm:grid-cols-2 gap-3">
        ${checkRow("Vital sign / BP คงที่", dd.vitalsStable)}
        ${checkRow("ตัดไหมแล้ว (Suture Removed)", dd.sutureRemoved)}
        ${checkRow("ไม่มีภาวะแทรกซ้อน (เลือดออก/ติดเชื้อ/ปัสสาวะผิดปกติ)", dd.noComplication)}
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        ${field("ประเมินแผลผ่าตัด", dd.woundStatus)}
        ${field("ยากลับบ้าน", dd.medications)}
        ${field("นัด Follow-up ครั้งแรก", dd.firstFollowupDate)}
        ${field("เบอร์ติดต่อฉุกเฉิน", dd.emergencyContact)}
      </div>
      ${adviceList("คำแนะนำก่อนกลับบ้าน", dd.advice)}
      <div>${field("สรุปค่าใช้จ่าย / สิทธิการรักษา", dd.costSummary)}</div>`;

      document.getElementById("recipient-discharge-panel").innerHTML = `
      <div class="rounded-xl border border-slate-100 p-4 flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-primary flex items-center justify-center shrink-0"><i data-lucide="user-round" class="w-5 h-5"></i></div>
        <div><p class="font-bold text-slate-800">${c.recipientName}</p><p class="text-xs text-slate-500">${c.recipientHn}</p></div>
      </div>
      ${Components.checklistSection({ title: "Graft Function คงที่", icon: "activity", items: rd.graftFunction }, { editable: true })}
      <div>
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Drug Level เข้าเป้า</p>
        ${drugLevelTable(rd.drugLevels)}
      </div>
      <div class="grid sm:grid-cols-2 gap-3">
        ${checkRow("Vital sign / BP / BW / Edema คงที่ ไม่มีไข้", rd.vitalsStable)}
        ${checkRow("ไม่มี Rejection เฉียบพลัน", rd.noRejection)}
      </div>
      <div class="grid sm:grid-cols-2 gap-4">
        ${field("แผลผ่าตัด", rd.woundStatus)}
        ${field("นัด Follow-up ครั้งแรก", rd.firstFollowupDate)}
        ${field("เบอร์ติดต่อฉุกเฉิน", rd.emergencyContact)}
        ${field("ทบทวนรายการยา (Medication Review)", rd.medicationReview)}
      </div>
      ${adviceList("สอนการใช้ยากดภูมิ (Immunosuppression)", rd.immunosuppressionTeaching)}
      ${adviceList("สอนบันทึกที่บ้าน (Home Monitoring)", rd.homeMonitoringTeaching)}
      <div>${field("ป้องกันการติดเชื้อ + อาหาร", rd.infectionPreventionAndDiet)}</div>`;

      lucide.createIcons();
    }

    document.getElementById("case-select").addEventListener("change", (e) => loadCase(e.target.value));
    loadCase(initialCaseId);

    document.getElementById("btn-save").addEventListener("click", () => {
      UI.toast("บันทึกความพร้อมก่อนกลับบ้านเรียบร้อยแล้ว", "success");
    });

    lucide.createIcons();
  </script>
</body>

</html>
