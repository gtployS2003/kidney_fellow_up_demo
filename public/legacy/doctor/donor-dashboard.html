<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kidney Donor Management | Kidney Transplant Follow-up System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
          fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>

<body class="font-sans bg-bgapp text-slate-800">

  <div class="flex min-h-screen">
    <div id="app-sidebar"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <div id="app-topbar"></div>

      <main class="flex-1 p-4 lg:p-6 space-y-6 max-w-[1600px] w-full mx-auto">

        <!-- Header -->
        <div class="flex flex-wrap items-center justify-between gap-3 fade-in">
          <div>
            <h2 class="text-xl font-bold text-slate-800">Kidney Donor Management</h2>
            <p class="text-sm text-slate-500 mt-0.5 flex flex-wrap items-center gap-x-3 gap-y-1">
              <span class="flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5"></i> อัปเดตล่าสุด 09
                ก.ย. 2569 · 09:00 น.</span>
              <span id="header-total" class="flex items-center gap-1.5"><i data-lucide="heart-handshake"
                  class="w-3.5 h-3.5"></i></span>
            </p>
          </div>
          <a href="donor-registration.html"
            class="flex items-center gap-2 px-3.5 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white text-sm font-medium transition"><i
              data-lucide="plus" class="w-4 h-4"></i> ลงทะเบียนผู้บริจาคใหม่</a>
        </div>

        <!-- Summary cards -->
        <div id="kpi-grid" class="grid grid-cols-2 lg:grid-cols-5 gap-4"></div>

        <!-- Alerts -->
        <div class="card p-5 fade-in">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2"><i data-lucide="bell-ring"
                class="w-4 h-4 text-amber-500"></i> รายการที่ต้องติดตาม (Attention Needed)</h3>
          </div>
          <div id="donor-alert-list" class="space-y-2"></div>
        </div>

        <!-- Donor Pipeline (Kanban) -->
        <div class="fade-in">
          <h3 class="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2"><i data-lucide="kanban"
              class="w-4 h-4 text-primary"></i> Donor Pipeline</h3>
          <p class="text-xs text-slate-400 mb-3">Registration → Screening → Evaluation → Matching → Approved → Completed
          </p>
          <div id="pipeline-board"></div>
        </div>

        <!-- Donor list -->
        <div class="card p-5 fade-in">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold text-slate-800 text-sm flex items-center gap-2"><i data-lucide="list"
                class="w-4 h-4 text-primary"></i> รายชื่อผู้บริจาคทั้งหมด</h3>
            <span id="row-count" class="badge badge-blue"></span>
          </div>
          <div class="overflow-x-auto">
            <table class="table-modern">
              <thead>
                <tr>
                  <th>Donor ID</th>
                  <th>ชื่อผู้บริจาค</th>
                  <th>Type</th>
                  <th>Blood</th>
                  <th>Risk</th>
                  <th>Stage</th>
                  <th class="text-right">Action</th>
                </tr>
              </thead>
              <tbody id="donor-tbody"></tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    StaffLayout.init({ role: "doctor", active: "donor-dashboard", title: "Kidney Donor Management" });

    const D = window.MOCK_DATA;
    const donors = D.donors;

    document.getElementById("header-total").innerHTML += `ผู้บริจาคในระบบทั้งหมด ${donors.length} ราย`;

    const STAGES = [
      { key: "registered", label: "Registered" },
      { key: "screening", label: "Screening" },
      { key: "evaluation", label: "Evaluation" },
      { key: "matching", label: "Matching" },
      { key: "approved", label: "Approved" },
      { key: "rejected", label: "Rejected" },
      { key: "completed", label: "Completed" },
    ];

    const stageBadgeMeta = {
      registered: { label: "Registered", badge: "badge-slate", icon: "clipboard-list" },
      screening: { label: "Screening", badge: "badge-blue", icon: "flask-conical" },
      evaluation: { label: "Evaluation", badge: "badge-amber", icon: "stethoscope" },
      matching: { label: "Matching", badge: "badge-amber", icon: "git-compare-arrows" },
      approved: { label: "Approved", badge: "badge-green", icon: "check-circle-2" },
      rejected: { label: "Rejected", badge: "badge-red", icon: "x-circle" },
      completed: { label: "Completed", badge: "badge-teal", icon: "badge-check" },
    };
    const riskBadge = { low: '<span class="badge badge-green">Low</span>', medium: '<span class="badge badge-amber">Medium</span>', high: '<span class="badge badge-red">High</span>' };

    const stageCounts = donors.reduce((acc, d) => ((acc[d.stage] = (acc[d.stage] || 0) + 1), acc), {});
    const potentialDonor = donors.filter((d) => ["registered", "screening", "evaluation", "matching"].includes(d.stage)).length;

    const kpis = [
      { icon: "heart-handshake", title: "Potential Donor", value: potentialDonor, iconBg: "bg-blue-50 text-primary" },
      { icon: "hourglass", title: "Evaluation Pending", value: stageCounts.evaluation || 0, iconBg: "bg-amber-50 text-amber-600" },
      { icon: "check-circle-2", title: "Approved Donor", value: stageCounts.approved || 0, iconBg: "bg-teal-50 text-teal" },
      { icon: "x-circle", title: "Rejected Donor", value: stageCounts.rejected || 0, iconBg: "bg-red-50 text-red-600" },
      { icon: "badge-check", title: "Donation Completed", value: stageCounts.completed || 0, iconBg: "bg-teal-50 text-teal" },
    ];
    document.getElementById("kpi-grid").innerHTML = kpis
      .map((k, i) => `<div class="fade-in fade-in-delay-${Math.min(i + 1, 4)} ${i === 4 ? "col-span-2 lg:col-span-1" : ""}">${Components.statCard(k)}</div>`)
      .join("");

    // Attention list — รวมประเด็นจาก Evaluation ที่มีความเสี่ยง/ไม่เหมาะสม และ Lab ที่รอผล
    const alertItems = [];
    D.donorEvaluations
      .filter((e) => e.result === "risk" || e.result === "not-suitable")
      .forEach((e) => {
        const donor = donors.find((d) => d.id === e.donorId);
        const level = e.result === "not-suitable" ? "critical" : "warning";
        alertItems.push({ level, title: `${e.result === "not-suitable" ? "ผลประเมินไม่เหมาะสม" : "พบข้อบ่งชี้ต้องเฝ้าระวัง"} · ${donor.name} (${e.donorId})`, desc: e.note, action: { label: "ดูการประเมิน", href: `donor-evaluation.html?id=${e.donorId}` } });
      });
    donors
      .filter((d) => d.infectionScreening === "อยู่ระหว่างตรวจ")
      .forEach((d) => alertItems.push({ level: "normal", title: `รอผลตรวจคัดกรองการติดเชื้อ · ${d.name} (${d.id})`, desc: `ลงทะเบียนเมื่อ ${d.registerDate} · ${d.hospital}`, action: { label: "ดู Lab", href: `donor-laboratory.html?id=${d.id}` } }));

    document.getElementById("donor-alert-list").innerHTML = alertItems.length
      ? alertItems.map((a) => Components.alertCard(a)).join("")
      : Components.emptyState({ icon: "check-circle-2", title: "ไม่มีรายการที่ต้องติดตามในขณะนี้" });

    // Pipeline board
    document.getElementById("pipeline-board").innerHTML = Components.statusPipeline({
      columns: STAGES,
      items: donors,
      stageField: "stage",
      cardRenderer: (d) => `
      <div class="kanban-card">
        <div class="flex items-center justify-between gap-2 mb-1">
          <p class="text-sm font-semibold text-slate-800 truncate">${d.name}</p>
          <span class="badge badge-slate">${d.blood}</span>
        </div>
        <p class="text-xs text-slate-500">${d.id} · ${d.type}</p>
        <div class="flex items-center justify-between mt-2">
          <span class="badge ${stageBadgeMeta[d.stage].badge}"><i data-lucide="${stageBadgeMeta[d.stage].icon}" class="w-3 h-3"></i> ${stageBadgeMeta[d.stage].label}</span>
          <a href="donor-profile.html?id=${d.id}" class="text-xs font-semibold text-primary hover:underline">View</a>
        </div>
      </div>`,
    });

    document.getElementById("row-count").textContent = `${donors.length} รายการ`;
    document.getElementById("donor-tbody").innerHTML = donors
      .map(
        (d) => `
    <tr>
      <td class="font-medium text-slate-700">${d.id}</td>
      <td>
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500">${d.name.slice(0, 2)}</div>
          <span class="font-medium text-slate-800">${d.name}</span>
        </div>
      </td>
      <td>${d.type}</td>
      <td><span class="badge badge-slate">${d.blood}</span></td>
      <td>${riskBadge[d.risk] || ""}</td>
      <td><span class="badge ${stageBadgeMeta[d.stage].badge}"><i data-lucide="${stageBadgeMeta[d.stage].icon}" class="w-3 h-3"></i> ${stageBadgeMeta[d.stage].label}</span></td>
      <td class="text-right"><a href="donor-profile.html?id=${d.id}" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-600 transition">View Detail</a></td>
    </tr>`
      )
      .join("");

    lucide.createIcons();
  </script>
</body>

</html>
