<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>หน้าแรก | Kidney Donor LIFF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: { DEFAULT: '#2563EB', dark: '#1D4ED8' }, teal: { DEFAULT: '#0F766E' } },
          fontFamily: { sans: ["'Segoe UI'", 'Arial', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../assets/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lucide@1.43.0/dist/umd/lucide.min.js"></script>
</head>

<body class="liff-body font-sans">
  <div class="liff-shell">
    <div id="liff-header"></div>

    <main class="flex-1 overflow-y-auto min-h-0 -mt-4 pb-6">

      <!-- Health Status Card -->
      <div class="px-4 fade-in">
        <div id="health-status-card" class="card p-5 shadow-md text-white"></div>
      </div>

      <!-- Alert -->
      <div class="px-4 mt-3 fade-in fade-in-delay-1">
        <div class="rounded-xl bg-amber-50 border border-amber-100 p-3.5 flex items-start gap-2.5">
          <i data-lucide="calendar-clock" class="w-4.5 h-4.5 text-amber-600 shrink-0 mt-0.5"></i>
          <div class="min-w-0">
            <p class="text-xs font-semibold text-amber-800">ใกล้ถึงกำหนดตรวจสุขภาพประจำปีที่ 4</p>
            <p class="text-[11px] text-amber-700 mt-0.5">นัดตรวจเลือดและพบแพทย์ 20 ก.ย. 2569 กรุณามาตามนัด</p>
          </div>
        </div>
      </div>

      <!-- Next appointment -->
      <div class="px-4 mt-4 fade-in fade-in-delay-1">
        <p class="text-sm font-bold text-slate-700 mb-2">นัดหมายถัดไป</p>
        <div class="card card-hover p-4" id="next-appt-card"></div>
      </div>

      <!-- Latest lab snapshot -->
      <div class="px-4 mt-4 fade-in fade-in-delay-2">
        <div class="flex items-center justify-between mb-2">
          <p class="text-sm font-bold text-slate-700">ผลตรวจล่าสุด</p>
          <a href="followup.html" class="text-xs font-semibold text-primary">ดูทั้งหมด</a>
        </div>
        <div id="home-lab-snapshot" class="grid grid-cols-2 gap-3"></div>
      </div>

      <!-- Menu grid -->
      <div class="px-4 mt-5 fade-in fade-in-delay-3">
        <p class="text-sm font-bold text-slate-700 mb-2">เมนูทั้งหมด</p>
        <div class="grid grid-cols-4 gap-3">
          <a href="appointment.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-blue-50 text-primary flex items-center justify-center"><i
                data-lucide="calendar-days" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">นัดหมาย</span>
          </a>
          <a href="followup.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center" style="color:#0f766e"><i
                data-lucide="activity" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">ติดตามอาการ</span>
          </a>
          <a href="questionnaire.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center"><i
                data-lucide="clipboard-list" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">แบบสอบถาม</span>
          </a>
          <a href="timeline.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><i
                data-lucide="history" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">Timeline</span>
          </a>
          <a href="chat.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center"><i
                data-lucide="message-circle" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">แชท</span>
          </a>
          <a href="knowledge.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center"><i
                data-lucide="book-open" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">ความรู้</span>
          </a>
          <a href="profile.html" class="liff-tap flex flex-col items-center gap-1.5 card p-3">
            <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center"><i
                data-lucide="user" class="w-5 h-5"></i></div><span
              class="text-[11px] font-medium text-slate-600 text-center">โปรไฟล์</span>
          </a>
        </div>
      </div>

    </main>

    <div id="liff-bottomnav"></div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/donor-liff-layout.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    DonorLiffLayout.init({ variant: "home", active: "home" });

    const donor = window.MOCK_DATA.primaryDonor;

    // Health Status Card — สถานะสุขภาพของผู้บริจาค (Healthy=Green / Warning=Orange / Critical=Red)
    const statusMeta = {
      low: { label: "Stable", gradient: "linear-gradient(135deg,#16a34a,#0d9488)", sub: "อาการคงที่ดี" },
      medium: { label: "Warning", gradient: "linear-gradient(135deg,#f59e0b,#ea580c)", sub: "ควรเฝ้าระวังอาการ" },
      high: { label: "Critical", gradient: "linear-gradient(135deg,#dc2626,#b91c1c)", sub: "ควรพบแพทย์ / ติดต่อทีมพยาบาลด่วน" },
    }[donor.risk] || { label: "Stable", gradient: "linear-gradient(135deg,#16a34a,#0d9488)", sub: "อาการคงที่ดี" };

    document.getElementById("health-status-card").style.background = statusMeta.gradient;
    document.getElementById("health-status-card").innerHTML = `
    <div class="flex items-center justify-between">
      <p class="text-xs text-white/80">สถานะสุขภาพวันนี้</p>
      <i data-lucide="heart-pulse" class="w-5 h-5 text-white/80"></i>
    </div>
    <p class="text-3xl font-extrabold mt-1">${statusMeta.label}</p>
    <p class="text-xs text-white/85 mt-1.5">${donor.followupStatusText}</p>`;

    // Next Appointment
    const nextAppt = window.MOCK_DATA.donorAppointments[0];
    document.getElementById("next-appt-card").innerHTML = `
    <div class="flex items-center gap-3">
      <div class="w-14 h-14 rounded-xl bg-primary text-white flex flex-col items-center justify-center shrink-0">
        <span class="text-[10px] leading-none">${nextAppt.date.split(" ").slice(1).join(" ")}</span>
        <span class="text-lg font-bold leading-none mt-0.5">${nextAppt.date.split(" ")[0]}</span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-800">${nextAppt.type}</p>
        <p class="text-xs text-slate-500 mt-0.5">${nextAppt.time} น. · ${nextAppt.doctor}</p>
        <p class="text-xs text-slate-400">${nextAppt.hospital}</p>
      </div>
      <a href="appointment.html" class="p-2 rounded-full bg-slate-50 liff-tap"><i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i></a>
    </div>
    <a href="appointment.html" class="liff-tap block w-full mt-3 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-semibold text-center">ดูรายละเอียด</a>`;

    // Latest Lab Snapshot (Creatinine / eGFR)
    document.getElementById("home-lab-snapshot").innerHTML = `
    <div class="card p-3.5">
      <p class="text-[11px] text-slate-400">Creatinine</p>
      <p class="text-xl font-bold text-slate-800 mt-0.5">${donor.creatinine}<span class="text-xs font-normal text-slate-400 ml-1">mg/dL</span></p>
    </div>
    <div class="card p-3.5">
      <p class="text-[11px] text-slate-400">eGFR</p>
      <p class="text-xl font-bold text-slate-800 mt-0.5">${donor.egfr}<span class="text-xs font-normal text-slate-400 ml-1">mL/min</span></p>
    </div>`;

    lucide.createIcons();
  </script>
</body>

</html>
